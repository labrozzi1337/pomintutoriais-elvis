map $http_x_forwarded_proto $protocolo_externo {
  default $scheme;
  https https;
}

map $uri $cache_control {
  ~^/assets/ "public, max-age=31536000, immutable";
  default "no-store";
}

limit_req_zone $binary_remote_addr zone=api:10m rate=15r/s;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 26m;
  resolver 127.0.0.11 valid=10s ipv6=off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Permissions-Policy "camera=(), geolocation=(), display-capture=(self), microphone=(self)" always;
  add_header Cache-Control $cache_control always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.backblazeb2.com; media-src 'self' blob: https://*.backblazeb2.com; img-src 'self' data: https://*.backblazeb2.com; frame-ancestors 'self';" always;

  location /api/ {
    set $backend_api http://api:3000;
    proxy_pass $backend_api;
    limit_req zone=api burst=60 nodelay;
    limit_req_status 429;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $protocolo_externo;
    proxy_request_buffering off;
  }

  location /assets/ {
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}

